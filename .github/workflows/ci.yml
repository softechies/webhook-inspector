name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t webhook-inspector .
      - name: Start the image and capture a request
        run: |
          docker run -d --name wi -p 3000:3000 webhook-inspector
          for i in $(seq 1 30); do curl -sf http://localhost:3000/ > /dev/null && break; sleep 1; done
          id=$(curl -sf -X POST http://localhost:3000/api/bins -H 'Content-Type: application/json' -d '{"name":"ci"}' | jq -r .id)
          curl -sf -X POST "http://localhost:3000/h/$id/test" -H 'Content-Type: application/json' -d '{"ok":true}'
          test "$(curl -sf http://localhost:3000/api/bins/$id/requests | jq length)" = "1"
      - if: always()
        run: docker logs wi || true
